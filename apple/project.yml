# FLOWS Apple app — xcodegen project definition.
# Regenerate the .xcodeproj with:  cd apple && xcodegen generate
# (FLOWS.xcodeproj is generated output and git-ignored.)
name: FLOWS
options:
  bundleIdPrefix: com.flows
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    # Rust core: FlowsCore.swift dlopens libflows_core at runtime in dev builds
    # (pure-Swift fallback when absent). Device/App Store builds static-link
    # ../rust/target/<triple>/release/libflows_core.a — see docs/APPLE_APP.md.
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FLOWS-iOS:
    type: application
    platform: iOS
    sources:
      - path: FLOWS/Sources
      - path: FLOWS/Resources
    info:
      path: FLOWS/Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: FLOWS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            # NOAA Weather Radio audio relays only (TruckerRadio streams).
            # Scoped to the radio host — the directory page on www stays under
            # full ATS (a failed scrape falls back to the bundled station
            # list). TLS 1.2 still required; only forward secrecy is waived,
            # and no location or personal data ever goes to this host.
            radio.weatherusa.net:
              NSIncludesSubdomains: false
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        NSLocationWhenInUseUsageDescription: >-
          FLOWS uses your location for turn-by-turn navigation and to keep the
          weather-risk map centered on you.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Continuous location access keeps navigation and hazard warnings
          current while FLOWS is guiding a route.
        NSAppleMusicUsageDescription: >-
          FLOWS shows Apple Music playback controls while navigating in
          CarPlay.
        NSMicrophoneUsageDescription: >-
          When FLOWS asks a question out loud — a crash check-in, or a
          faster-route offer — it listens briefly for your spoken yes-or-no
          reply; the mic buttons listen for what to play (a music ask, a
          radio station). Nothing records outside those short moments.
        NSSpeechRecognitionUsageDescription: >-
          Understands short spoken answers ("yes", "no", "I'm okay") and
          asks ("classic country", "the weather radio") to crash check-ins,
          route questions, and the music and radio mic buttons.
        NSMotionUsageDescription: >-
          Crash detection watches for sudden impacts while navigating.
        NSBluetoothAlwaysUsageDescription: >-
          FLOWS listens for Bluetooth tire-pressure sensors and OBD-II
          adapters to show real fuel level and tire pressure.
        UISupportedExternalAccessoryProtocols:
          - com.scantool.stn
          - com.obdlink.obd
        CFBundleURLTypes:
          - CFBundleURLName: com.flows.app
            CFBundleURLSchemes:
              - flows
        UIBackgroundModes:
          - location
          # Radio (NOAA relays + AM/FM streams) must keep playing with the
          # screen locked or the app backgrounded — without this mode iOS
          # silences AVPlayer the moment the app leaves the foreground.
          - audio
        # CarPlay map scene — activates only when the CarPlay entitlement
        # (com.apple.developer.carplay-maps) is granted by Apple.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        # com.flows.app is registered to another team on Apple's portal —
        # device provisioning needs an id OUR team can claim.
        PRODUCT_BUNDLE_IDENTIFIER: com.wizeman555.flows
        PRODUCT_NAME: FLOWS            # menu bar / app name, not the target name
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        # CarPlay is testable BEFORE Apple grants the entitlement: the
        # Simulator does not validate entitlements against a provisioning
        # profile, so declaring carplay-maps for SIMULATOR BUILDS ONLY makes
        # the whole CarPlay surface developable now. Device builds get no
        # entitlements file and are unaffected — requesting an entitlement a
        # profile lacks fails code signing, which would make the app
        # un-installable rather than merely CarPlay-less.
        # Test with: Simulator.app ▸ I/O ▸ External Displays ▸ CarPlay.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: FLOWS/Entitlements/FLOWS-iOS-Simulator.entitlements
        # Static-link the Rust core per SDK — the device and
        # simulator need their own cross-compiled slices. `-u` force-keeps the
        # C symbol so FlowsCore's loader resolves it (Swift fallback otherwise).
        OTHER_LDFLAGS[sdk=iphoneos*]: $(SRCROOT)/../rust/target/aarch64-apple-ios/release/libflows_core.a -Wl,-u,_flows_polyline_decode -Wl,-u,_flows_transit_selftest
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(SRCROOT)/../rust/target/aarch64-apple-ios-sim/release/libflows_core.a -Wl,-u,_flows_polyline_decode -Wl,-u,_flows_transit_selftest
    preBuildScripts:
      - name: Build Rust flows-core (iOS device + simulator)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || { echo "cargo not on PATH — linking existing libflows_core.a"; exit 0; }
          cd "$SRCROOT/../rust"
          cargo build --release --target aarch64-apple-ios || echo "device slice build failed"
          cargo build --release --target aarch64-apple-ios-sim || echo "sim slice build failed"

  FLOWS-Watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FLOWSWatch
    info:
      path: FLOWS/Generated/Info-Watch.plist
      properties:
        CFBundleDisplayName: FLOWS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wizeman555.flows
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizeman555.flows.watchkitapp
        PRODUCT_NAME: FLOWS
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO

  FLOWS-macOS:
    type: application
    platform: macOS
    sources:
      - path: FLOWS/Sources
      - path: FLOWS/Resources
    info:
      path: FLOWS/Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: FLOWS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSExceptionDomains:
            # NOAA Weather Radio audio relays only (TruckerRadio streams).
            # Scoped to the radio host — the directory page on www stays under
            # full ATS (a failed scrape falls back to the bundled station
            # list). TLS 1.2 still required; only forward secrecy is waived,
            # and no location or personal data ever goes to this host.
            radio.weatherusa.net:
              NSIncludesSubdomains: false
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        NSLocationUsageDescription: >-
          FLOWS uses your location to center the weather-risk map and preview
          routes from where you are.
        NSAppleEventsUsageDescription: >-
          FLOWS controls Music playback (play/pause, skip, shuffle) for
          hands-free listening while navigating.
        NSBluetoothAlwaysUsageDescription: >-
          FLOWS listens for Bluetooth tire-pressure sensors and OBD-II
          adapters to show real fuel level and tire pressure.
        CFBundleURLTypes:
          - CFBundleURLName: com.flows.app.mac
            CFBundleURLSchemes:
              - flows
        LSApplicationCategoryType: public.app-category.navigation
    entitlements:
      path: FLOWS/Generated/FLOWS-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
        com.apple.security.device.bluetooth: true
        # Sandbox: allow Apple Events to Music.app only (hands-free music).
        com.apple.security.temporary-exception.apple-events:
          - com.apple.Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flows.app.mac
        PRODUCT_NAME: FLOWS            # menu bar / app name, not the target name
        # Real signing identity, NOT ad-hoc: TCC keys permission grants to the
        # app's designated requirement. Ad-hoc signatures change every build,
        # so macOS re-prompted for Location on each rebuild; a team-anchored
        # signature makes one grant persist across all future builds. The
        # entitlements here are all unrestricted — no provisioning profile
        # needed for local macOS signing.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 3T5JWQ4XW4
        # Static-link the Rust core. `-u` force-keeps the C
        # symbol so FlowsCore.swift's dlsym(dlopen(nil)) resolves it and the
        # app runs the Rust polyline decoder, not the Swift fallback.
        OTHER_LDFLAGS: $(SRCROOT)/../rust/target/release/libflows_core.a -Wl,-u,_flows_polyline_decode -Wl,-u,_flows_transit_selftest
    preBuildScripts:
      - name: Build Rust flows-core
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v cargo >/dev/null 2>&1; then
            (cd "$SRCROOT/../rust" && cargo build --release) \
              || echo "flows-core build failed — linking existing libflows_core.a"
          else
            echo "cargo not on PATH — linking existing libflows_core.a"
          fi

  FLOWSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Pure-function tests compile the sources they exercise directly —
      # no app host needed, runs headless in CI.
      - path: FLOWS/Sources/Core/FlowsCore.swift
      - path: FLOWS/Sources/Core/POIRanking.swift
      - path: FLOWS/Sources/Core/RouteAttributes.swift
      - path: FLOWS/Sources/Core/RiskEquations.swift
      - path: FLOWS/Sources/Core/RiskAdvice.swift
      - path: FLOWS/Sources/Core/SeasonalRiskModel.swift
      - path: FLOWS/Sources/Core/EverydayRadius.swift
      - path: FLOWS/Sources/Core/HarmonicClimatology.swift
      - path: FLOWS/Sources/Core/PlacesStore.swift
      - path: FLOWS/Sources/Core/LatitudeBands.swift
      - path: FLOWS/Sources/Core/ClimateProfiles.swift
      - path: FLOWS/Sources/Core/BadgeClustering.swift
      - path: FLOWS/Sources/Core/InternationalWeather.swift
      - path: FLOWS/Sources/Core/NWSForecastService.swift
      - path: FLOWS/Sources/Core/TripNeeds.swift
      - path: FLOWS/Sources/Core/ImminentAlerts.swift
      - path: FLOWS/Sources/Core/Favorites.swift
      - path: FLOWS/Sources/Core/FilterLimits.swift
      - path: FLOWS/Sources/Core/RiskTiming.swift
      - path: FLOWS/Sources/Core/VehicleProfile.swift
      - path: FLOWS/Sources/Core/VehicleSpecs.swift
      - path: FLOWS/Sources/Core/FuelPrices.swift
      - path: FLOWS/Sources/Core/TripCosts.swift
      - path: FLOWS/Sources/Core/TripShare.swift
      - path: FLOWS/Sources/Core/AlertEntityParser.swift
      - path: FLOWS/Sources/Core/CrashLogic.swift
      - path: FLOWS/Sources/Core/GradeProfile.swift
      - path: FLOWS/Sources/Core/TowingLimits.swift
      - path: FLOWS/Sources/Core/RefuelLearning.swift
      - path: FLOWS/Sources/Core/PursuitReach.swift
      - path: FLOWS/Sources/Core/LiveHazardFeeds.swift
      - path: FLOWS/Sources/Core/RatingsAndCost.swift
      - path: FLOWS/Sources/Core/BrandKnowledge.swift
      - path: FLOWS/Sources/Core/SecureStore.swift
      - path: FLOWS/Sources/Core/DestinationSearch.swift
      - path: FLOWS/Sources/Core/MusicProviders.swift
      - path: FLOWS/Sources/Core/TouristInfo.swift
      - path: FLOWS/Sources/Core/RiskFieldService.swift
      - path: FLOWS/Sources/Core/VehicleLink.swift
      - path: FLOWS/Sources/Core/EPAVehicleDatabase.swift
      - path: FLOWS/Sources/Core/PrimarySources.swift
      - path: FLOWS/Sources/Core/WMOAlerts.swift
      - path: FLOWS/Sources/Core/TransitItinerary.swift
      - path: FLOWS/Sources/Core/AmtrakStations.swift
      - path: FLOWS/Sources/Core/AirTravel.swift
      - path: FLOWS/Sources/Core/HybridWalk.swift
      # The bundled station list rides along so the suite can pin that the
      # shipping resource parses and covers the network.
      - path: FLOWS/Resources/amtrak_stations.json
        buildPhase: resources
      - path: FLOWS/Sources/Core/AdaptiveTuning.swift
      - path: FLOWS/Sources/Core/CameraZoom.swift
      - path: FLOWS/Sources/Core/FuelWarning.swift
      - path: FLOWS/Sources/Core/SpeedSign.swift
      - path: FLOWS/Sources/Core/OfflineCorridors.swift
      - path: FLOWS/Sources/Core/ThrottledNet.swift
      - path: FLOWS/Sources/Core/TruckerRadio.swift
      - path: FLOWS/Sources/Core/RadioBrowser.swift
      - path: FLOWS/Sources/Core/MusicController.swift
      - path: FLOWS/Sources/Core/SpotifyRemote.swift
      - path: FLOWS/Sources/Core/SiriSummaries.swift
      - path: FLOWS/Sources/Core/VoiceReply.swift
      - path: FLOWS/Sources/Core/TextScale.swift
      - path: FLOWS/Sources/Core/IntentClarifier.swift
      - path: FLOWS/Sources/Core/PlaybackFallback.swift
      - path: FLOWS/Sources/Core/PlaybackGrace.swift
      - path: FLOWS/Sources/Core/BufferLearning.swift
      - path: FLOWS/Sources/Core/SignalQuality.swift
      - path: FLOWS/Sources/Core/FlowsDiag.swift
      - path: FLOWS/Sources/Core/SecureBehaviorStore.swift
      - path: FLOWS/Sources/Core/RouteHeadTrainer.swift
      - path: FLOWS/Sources/Core/DrivingProfile.swift
      - path: FLOWS/Sources/Core/ChoiceLog.swift
      - path: FLOWS/Sources/Core/DestinationPrediction.swift
      - path: FLOWS/Sources/Core/WeatherAlertService.swift
      - path: FLOWS/Sources/Core/RouteService.swift
      - path: FLOWSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flows.app.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES   # test bundles get a stub plist
        # Link the Rust core so the suite can assert it's LIVE and prove the
        # Rust decoder is byte-identical to the Swift fallback.
        OTHER_LDFLAGS: $(SRCROOT)/../rust/target/release/libflows_core.a -Wl,-u,_flows_polyline_decode -Wl,-u,_flows_transit_selftest

schemes:
  FLOWSTests:
    build:
      targets:
        FLOWSTests: all
    test:
      targets:
        - FLOWSTests
