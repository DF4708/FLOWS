# CI: the two suites that actually gate the product. Replaces r.yml, which
# rcmdcheck'd the R engine retired in c8a903e (no DESCRIPTION, no R/ — it
# could never pass and misled the repo status).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest   # arm64 — same ISA family the product ships on
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain so CI's clippy matches the dev machine: an unpinned
      # runner used a newer Rust whose added lints failed -D warnings while
      # local (1.93.1) was clean. Pinned here, not in a repo-wide
      # rust-toolchain.toml, so it doesn't force a second toolchain install
      # on developers who track `stable`.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - name: formatting (rustfmt, no drift)
        run: cargo fmt --all --check
        working-directory: rust
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: tests (release — includes the CH/RAPTOR and Swift oracle gates)
        run: cargo test --release --workspace
        working-directory: rust
      # flows-bridge's build.rs regenerates apple/FLOWS/RustBridge on every
      # build above. Generated bindings are committed and never hand-edited
      # (3.25.5): any difference here means someone edited them, or forgot to
      # commit a regeneration.
      - name: bridge bindings match their declarations
        run: git diff --exit-code -- apple/FLOWS/RustBridge

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The test target depends on the RustBridge aggregate target, which runs
      # scripts/build_rust_bridge.sh: a universal macOS library, so both darwin
      # targets are needed on the same pinned toolchain as the rust job.
      # scripts/build_rust_bridge.sh builds every platform library on every
      # run (the aggregate target cannot tell which SDK the app wants), so all
      # five targets must be installed or the script's hard error fires.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: xcodegen
        run: brew install xcodegen
      - name: generate project
        run: xcodegen generate
        working-directory: apple
      - name: tests
        run: >
          xcodebuild -project FLOWS.xcodeproj -scheme FLOWSTests
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
        working-directory: apple
