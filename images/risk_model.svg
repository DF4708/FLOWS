<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="920" height="500" rx="16" fill="#0f1419"/>
  <text x="460" y="42" text-anchor="middle" fill="#e8eef5" font-size="24" font-weight="700">Two-tier realized risk — proof, not prediction</text>
  <text x="460" y="66" text-anchor="middle" fill="#7f8c9b" font-size="13">Primary hazards can band Red alone · predictors only amplify a realized primary and cap below Red</text>

  <!-- Primary column -->
  <rect x="40" y="96" width="400" height="264" rx="12" fill="#241318" stroke="#7a2b2b"/>
  <text x="240" y="124" text-anchor="middle" fill="#ff7b6b" font-size="16" font-weight="700">PRIMARY — can reach Red alone</text>
  <text x="60" y="150" fill="#9aa7b3" font-size="12">Road impassable OR direct danger passing through.</text>
  <text x="60" y="168" fill="#9aa7b3" font-size="12">Carries REALIZED signals only.</text>
  <g fill="#e6d0cf" font-size="13">
    <text x="60" y="200">🔥 fire perimeter / hotspot</text>
    <text x="60" y="224">🌊 flood — gauge over road · waterline crossing</text>
    <text x="60" y="248">🚧 closure — DOT WZDx blocked road</text>
    <text x="60" y="272">🌀 storm warning · tropical · tsunami</text>
    <text x="60" y="296">⛰ seismic · volcanic</text>
  </g>
  <text x="60" y="330" fill="#c98b84" font-size="11.5" font-style="italic">Warnings of in-progress danger = realized.</text>
  <text x="60" y="348" fill="#c98b84" font-size="11.5" font-style="italic">A forecast, watch, or outlook is NOT proof.</text>

  <!-- Secondary column -->
  <rect x="480" y="96" width="400" height="264" rx="12" fill="#132420" stroke="#2b7a55"/>
  <text x="680" y="124" text-anchor="middle" fill="#6be0a0" font-size="16" font-weight="700">PREDICTORS — capped below Red</text>
  <text x="500" y="150" fill="#9aa7b3" font-size="12">Amplify a realized primary (scaled by how</text>
  <text x="500" y="168" fill="#9aa7b3" font-size="12">realized it is); a standalone advisory otherwise.</text>
  <g fill="#cfe6d8" font-size="13">
    <text x="500" y="200">💨 wind · 🌡 heat · ❄ cold</text>
    <text x="500" y="224">🌧 precip probability · winter forecast</text>
    <text x="500" y="248">⚡ convective outlook · 🏔 avalanche rating</text>
    <text x="500" y="272">🌫 air/smoke · ☀ UV/radiation</text>
  </g>
  <text x="500" y="306" fill="#7fc9a0" font-size="11.5" font-style="italic">Gated to the regional + seasonal normal:</text>
  <text x="500" y="324" fill="#7fc9a0" font-size="11.5" font-style="italic">between the seasonal avg min/max = "normal",</text>
  <text x="500" y="342" fill="#7fc9a0" font-size="11.5" font-style="italic">nothing draws on the map.</text>

  <!-- combine bar -->
  <rect x="40" y="392" width="840" height="72" rx="12" fill="#18212b" stroke="#2b3a48"/>
  <text x="60" y="418" fill="#e8eef5" font-size="14" font-weight="700">realizedRisk =</text>
  <text x="60" y="440" fill="#c4d0dc" font-size="12.5">primary ⊕ (amplified by predictors)  ·  overlapping small risks NEVER sum to lethal  ·  Green 0.398 / Yellow 0.699 / Red 0.875</text>
  <text x="60" y="457" fill="#8fa1b0" font-size="11">Flood detail: waterline = localMin + rainDepth; a road floods when its headroom above the local low &lt; rain depth, else only with river/lake/FEMA/gauge evidence.</text>
</svg>
