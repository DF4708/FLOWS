[package]
name = "flows-train"
version = "0.1.0"
edition = "2021"
description = "FLOWS trainers + data tooling (ranking head, climatology bundles, POI shards) — pure std by rule"
# Proprietary — never publishable to a registry.
publish = false

# The on-device route-risk head trainer (phase 2a). Pure std, ZERO external
# crates — same discipline as flows-core. Produces the weights that Swift
# `LearnedHead` runs. See ml/route-gnn/README.md.
[[bin]]
name = "flows-train"
path = "src/main.rs"

# National per-ZIP seasonal-climatology baseline merged into the app risk
# bundle (dense CONUS choropleth). Pure std, zero crates.
[[bin]]
name = "national-bundle"
path = "src/bin/national-bundle.rs"

# 20-year NOAA Storm Events historical hazard baseline: real per-ZIP x week x
# family frequencies replacing the hand-encoded climatology. Pure std, zero
# crates. See scripts/build_history_baseline.sh for the download-and-run flow.
[[bin]]
name = "history-baseline"
path = "src/bin/history-baseline.rs"

# Offline POI shards: compiles the Foursquare OS Places TSV (Apache 2.0) into
# per-state binary .fps shards with a 0.2 deg grid index. Pure std, zero
# crates. See scripts/build_places_shards.sh for the end-to-end flow.
[[bin]]
name = "places-shard"
path = "src/bin/places-shard.rs"

[dependencies]
