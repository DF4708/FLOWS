[package]
name = "flows-core"
version = "0.1.0"
edition = "2021"
description = "FLOWS compute core — risk bands, scoring, polyline, CH routing, RAPTOR transit, C-ABI FFI"
# Proprietary — never publishable to a registry.
publish = false

[lib]
# staticlib: links directly into the Swift binary (libflows_core.a).
# rlib: lets the Rust test harness exercise the same code.
# cdylib: the .dylib the Swift app dlopens in dev builds (FlowsCore.swift);
# staticlib: linked into device/App Store builds; rlib: the workspace bins.
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
# Phase R0 is intentionally dependency-free — pure std — so the PoC builds
# fast and small even under the memory ceiling. Feeds/geo/routing crates
# (reqwest, serde, geo, fast_paths, rstar) arrive in later phases.
