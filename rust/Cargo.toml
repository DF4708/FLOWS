# FLOWS Rust core — workspace root.
# Phase R0 proof-of-concept per docs/RUST_SWIFT_MIGRATION.md.
# Keeps the R app as the correctness oracle: every function here is verified
# byte-identical to its R counterpart in the crate's test suite.
[workspace]
members = ["flows-core", "flows-train"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Appendix A: release overflow behaviour MUST be a deliberate decision, not
# whatever the profile happens to default to. It is ON. These crates compute
# routes and risk bands for a driving app and build the binary bundles the
# app reads; a silently wrapped index or duration is a wrong turn or a wrong
# hazard score, and the standard ranks correctness over speed (1.4). Where
# wrapping or saturation is the INTENDED semantics, the code says so with
# `wrapping_*` / `saturating_*` / `checked_*` rather than leaning on this.
overflow-checks = true
